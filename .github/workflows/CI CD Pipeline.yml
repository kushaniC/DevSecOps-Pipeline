name: DevSecOps Security Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- GATE 2: Dependency / SCA Scanning ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies (skip scripts to avoid internal tests/linting)
        run: npm ci --ignore-scripts
      - name: Run npm audit (Fail on High/Critical)
        run: npm audit --audit-level=high

      # --- GATE 1: SAST (Semgrep) ---
      - name: Run Semgrep SAST
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/default

      # --- GATE 3: Secrets Scanning (Gitleaks) ---
      - name: Run Gitleaks Secrets Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- GATE 4: Container Image Scanning (Trivy) ---
      - name: Build Docker Image for Scanning
        run: docker compose build juice-shop
        env:
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
          
      - name: Run Trivy Container Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'devsecopspipeline-juice-shop:latest'
          format: 'table'
          exit-code: '1' 
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH' 