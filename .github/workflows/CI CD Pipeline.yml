name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-secure:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------
      # STEP 1: Checkout
      # -----------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # -----------------------------
      # STEP 2: Setup Node.js
      # -----------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      # -----------------------------
      # STEP 3: Install dependencies
      # -----------------------------
      - name: Install dependencies
        run: npm install 

      # -----------------------------
      # STEP 4: Build
      # -----------------------------
      - name: Build Backend Server
        run: npm run build:server

      # -----------------------------
      # STEP 5: Automated Security Regression Tests
      # -----------------------------
      - name: Run Security Regression Tests
        run: |
          printf '%s' "$JWT_PRIVATE_KEY" | sed 's/\\n/\n/g' > /tmp/jwt-private.key
          chmod 600 /tmp/jwt-private.key
          openssl pkey -in /tmp/jwt-private.key -pubout -out /tmp/jwt-public.pem
          export JWT_PUBLIC_KEY_PATH=/tmp/jwt-public.pem
          node --import ./test/api/helpers/test-env.mjs --import tsx --test --test-force-exit "test/api/security-regression.test.ts"
        env:
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
      
      # -----------------------------
      # SECURITY GATE 1
      # SAST - Semgrep
      # -----------------------------
      - name: Run Semgrep SAST
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/default

      # -----------------------------
      # SECURITY GATE 2
      # Dependency / SCA
      # -----------------------------
      - name: Run npm audit
        run: npm audit --audit-level=high

      # -----------------------------
      # SECURITY GATE 3
      # Secrets - Gitleaks
      # -----------------------------
      - name: Run Gitleaks Secrets Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------
      # STEP 6: Build Docker Image
      # -----------------------------
      - name: Build Docker Image for Scanning
        run: docker compose build juice-shop
        env:
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}

      # -----------------------------
      # SECURITY GATE 4
      # Container - Trivy
      # -----------------------------
      - name: Run Trivy Container Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "devsecopspipeline-juice-shop:latest"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"