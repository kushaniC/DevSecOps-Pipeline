version: '3.8'

services:
  # Component 1: Frontend / Edge Proxy
  nginx-frontend:
    build: ./nginx
    ports:
      - "80:80"
    depends_on:
      - juice-shop
    networks:
      - frontend-net
      - backend-net

  # Component 2: Backend API (Using official pre-containerized image as permitted by brief)
  juice-shop:
    build: .
    expose:
      - "3000"
    networks:
      - backend-net
    environment:
      - NODE_ENV=unsafe
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY:-placeholder-insecure-dev-key-do-not-use}

# Network segmentation to demonstrate security best practices
networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
    internal: true # This prevents the backend from being accessed directly from the outside internet